uospatial sketchpad that manipulates spatial arrays and mental imagery"], "correct": "C", "explanation": "定位段落 2：巴德利的多成分模型包含：中央執行系統（A）、語音迴路（B）、視覺空間素描板（D）以及情節緩衝區。選項 C 提及消化蛋白質的內臟自律神經叢，屬生理消化系統而非工作記憶認知組件，為正確答案。"}, {"num": "3", "type": "Vocabulary in Context", "stem": "The word \"impulsive\" in paragraph 3 is closest in meaning to:", "options": ["A. spontaneous", "B. calculated", "C. permanent", "D. academic"], "correct": "A", "explanation": "段落 3 語境：'override impulsive biases'，impulsive 意為「衝動的、本能的、自發未經思索的」。選項 A (spontaneous, 自發衝動的、未經深思熟慮的) 最為接近。B (calculated, 精心計算的)、C (permanent, 永久的)、D (academic, 學術的) 均不符合詞義。"}, {"num": "4", "type": "Rhetorical Purpose", "stem": "Why does the author contrast System 1 and System 2 in paragraph 3?", "options": ["A. To argue that System 1 should be completely eliminated from the human brain through surgical intervention", "B. To illustrate how working memory capacity acts as the critical bottleneck separating fast, automatic intuition from slow, effortful deliberation", "C. To prove that System 2 consumes no physiological energy or glucose", "D. To demonstrate that emotional feelings play no role in human decision-making"], "correct": "B", "explanation": "定位段落 3 第一句：'Working memory capacity functions as the critical anatomical bottleneck that bridges cognitive architecture with dual-process theories of human judgment.' 作者對比系統一與系統二，旨在闡明工作記憶容量如何作為關鍵瓶頸，將自動快速的直覺系統與緩慢、高度消耗工作記憶的深思熟慮系統區分開來。選項 B 正確。"}, {"num": "5", "type": "Inference", "stem": "Which of the following can be inferred from paragraph 4 about the relationship between extraneous load and learning effectiveness?", "options": ["A. Reducing extraneous load by organizing instructional materials cleanly frees up working memory bandwidth for constructing mental schemas.", "B. High extraneous load is necessary to force students to expand their total short-term memory capacity.", "C. Intrinsic load can be permanently eliminated if extraneous load is increased to maximum levels.", "D. Germane load occurs exclusively when learners are deprived of all visual diagrams."], "correct": "A", "explanation": "定位段落 4：'When extraneous load encroaches upon working memory capacity, the brain lacks the cognitive bandwidth required for germane load—the active mental schema construction...' 這說明減少外在負荷（消除不良排版或混亂干擾）能夠騰出工作記憶頻寬，讓大腦專注於增惠負荷（建構心智基模）。選項 A 為最精準合理的推論。"}, {"num": "6", "type": "Vocabulary in Context", "stem": "The word \"encroaches\" in paragraph 4 is closest in meaning to:", "options": ["A. intrudes", "B. multiplies", "C. stabilizes", "D. disappears"], "correct": "A", "explanation": "段落 4 語境：'When extraneous load encroaches upon working memory capacity...'，encroach upon 意為「侵佔、侵蝕、侵犯」。選項 A (intrudes, 侵入、侵擾) 為最精確同義詞。B (multiplies, 增加)、C (stabilizes, 穩定)、D (disappears, 消失) 均不符合。"}, {"num": "7", "type": "Factual Information", "stem": "According to paragraph 5, how does the psychological experience of chronic poverty impose a \"bandwidth tax\" on cognitive functioning?", "options": ["A. By causing physical atrophy in the auditory bones of the inner ear", "B. By monopolizing central executive working memory resources with constant anxieties over immediate subsistence needs", "C. By permanently preventing the phonological loop from processing spoken vocabulary", "D. By accelerating the transition of all memories directly into permanent long-term storage"], "correct": "B", "explanation": "定位段落 5：'conditions of acute poverty... impose an involuntary \"bandwidth tax\" on the human mind. The persistent, intrusive preoccupation with meeting basic subsistence needs... monopolizes precious central executive resources. Depleted of working memory capacity, individuals are effectively forced to rely on intuitive System 1 heuristics...' 選項 B 精確重現了生存焦慮壟斷中央執行工作記憶資源的核心論點。A、C、D 均屬無稽之談。"}, {"num": "8", "type": "Sentence Simplification", "target_sentence": "Recognizing that human cognitive mastery resides not in an infinite capacity for internal calculation, but in the strategic, ergonomic management of our strictly finite working memory bandwidth enables the design of effective externalized aids.", "stem": "Which of the sentences below best expresses the essential information in the highlighted sentence in paragraph 6? Incorrect choices change the meaning in important ways or leave out essential information.", "options": ["A. Effective cognitive tools can be created once we understand that true mental capability depends on wisely managing strictly limited working memory rather than on possessing limitless computing power.", "B. Human beings possess unlimited internal calculation capacity that eliminates the need for any ergonomic external aids.", "C. Strategic management of working memory bandwidth is only possible for individuals who have memorized infinite mathematical equations.", "D. Externalized tools should be banned because human cognitive mastery requires exclusively internal mental computations."], "correct": "A", "explanation": "原句核心邏輯：認識到人類認知優勢不在於無限內部計算（resides not in an infinite capacity for internal calculation）+ 而在於策略性管理嚴格有限的工作記憶頻寬（but in the strategic, ergonomic management of finite working memory）+ 促成了有效外化工具的設計（enables the design of effective externalized aids）。選項 A 精準改寫了『智力不在於無限算力，而在於明智管理有限工作記憶，從而促進外化工具設計』的主旨。B 與原文相反；C 偏離文意；D 荒謬主張禁止外化工具。"}, {"num": "9", "type": "Text Insertion", "insert_sentence": "Consequently, working memory is not a passive sponge, but an energetic cognitive bottleneck.", "stem": "Look at the four squares [■] that indicate where the following sentence could be added to paragraph 4.\n\n\"Consequently, working memory is not a passive sponge, but an energetic cognitive bottleneck.\"\n\nWhere would the sentence best fit?", "options": ["A. [■ A]", "B. [■ B]", "C. [■ C]", "D. [■ D]"], "correct": "A", "explanation": "段落 3 結尾介紹了系統一與系統二對工作記憶的不同要求，指出系統二極度耗能。段落 4 開頭 [■ A] 緊接著：'Because the central executive and System 2 deliberation draw upon a strictly finite metabolic reservoir of working memory capacity, the brain is perpetually susceptible to cognitive overload.' 待插入句 'Consequently, working memory is not a passive sponge, but an energetic cognitive bottleneck.'（因此，工作記憶並非被動的海綿，而是一個高能耗的認知瓶頸），以 Consequently 作為承接上文的總結，精準駁斥了海綿被動說並點出『高能耗認知瓶頸』，恰好置於 [■ A] 處作為段落總起句。插入在 [■ A] 最為有力。"}, {"num": "10", "type": "Prose Summary", "intro": "Working memory is a limited-capacity, multicomponent system that governs human reasoning, dictates dual-process decision modes, and shapes socioeconomic behavior.", "stem": "An introductory sentence for a brief summary of the passage is provided above. Complete the summary by selecting the THREE answer choices that express the most important ideas in the passage. Some sentences do not belong in the summary because they express ideas that are not presented in the passage or are minor ideas in the passage. This question is worth 2 points.", "options": ["A. Baddeley and Hitch's model replaced static short-term storage with an active central executive and specialized slave buffers (phonological loop and visuospatial sketchpad).", "B. Working memory capacity divides fast, automatic System 1 intuition from slow, metabolically demanding System 2 deliberative thought.", "C. Cognitive load theory and the \"bandwidth tax\" of poverty reveal how mental exhaustion impairs rational decision-making by forcing reliance on heuristic shortcuts.", "D. Sendhil Mullainathan proved that human beings can completely eliminate all cognitive biases by consuming excess glucose drinks.", "E. John Sweller demonstrated that the phonological loop can retain verbal information permanently without requiring any rehearsal.", "F. Atkinson and Shiffrin invented punch-clocks to measure the exact millisecond duration of human long-term memories."], "correct": ["A", "B", "C"], "explanation": "選項 A 概括了巴德利多成分工作記憶模型對古典靜態記憶模型的革新（段落 1 與 2）；選項 B 概括了工作記憶容量作為系統一與系統二雙歷程思維分水嶺的關鍵角色（段落 3）；選項 C 概括了認知負荷理論與貧困心智頻寬稅對理性決策受損的現實影響（段落 4 與 5）。D 捏造喝糖水消除偏誤；E 扭曲語音迴路特徵；F 荒唐把阿特金森與工廠打卡鐘混為一談。"}], "vocab_list": [{"word": "Multimodal", "pos": "adj.", "phonetic": "[͵mʌltɪˋmod!] ", "meaning": "多模態的；整合多種感官形式的（結合視覺、聽覺、本體感覺等多種資訊輸入通道的）", "collocations": [{"en": "multimodal episodic buffer", "zh": "多模態情節緩衝區"}, {"en": "multimodal sensory integration", "zh": "多模態感官整合"}, {"en": "multimodal learning environment", "zh": "多模態學習環境"}], "toefl_app": "認知科學與人工智慧核心高頻詞。例：'The episodic buffer binds visual and phonological inputs into an integrated multimodal representation.' (情節緩衝區將視覺與語音輸入綁定為一個整合的多模態表徵。)"}, {"word": "Heuristic", "pos": "n. & adj.", "phonetic": "[hjuˋrɪstɪk]", "meaning": "啟發式經驗法則；啟發式的（心理學指用於快速做出判斷或解決問題的思維心理捷徑）", "collocations": [{"en": "affective heuristic", "zh": "情感啟發式"}, {"en": "heuristic shortcuts in decision-making", "zh": "決策中的啟發式思維捷徑"}, {"en": "rely on intuitive heuristics", "zh": "依賴直覺性啟發法則"}], "toefl_app": "行為經濟學與判斷決策核心考點詞。例：'Under intense time pressure, humans default to System 1 heuristics rather than rigorous calculation.' (在緊張的時間壓力下，人類傾向於使用系統一啟發式經驗而非嚴謹計算。)"}, {"word": "Extraneous", "pos": "adj.", "phonetic": "[ɪkˋstrenɪəs]", "meaning": "外來的；無關緊要的；非本質的心智干擾（認知負荷理論指教學或界面不良引起的無效負擔）", "collocations": [{"en": "extraneous cognitive load", "zh": "外在認知負荷"}, {"en": "eliminate extraneous distractions", "zh": "消除外來干擾"}, {"en": "extraneous material in textbooks", "zh": "教科書中的無關冗餘材料"}], "toefl_app": "教育心理學與系統設計經典高分詞。例：'Poor interface design generates extraneous cognitive load that impairs knowledge acquisition.' (粗劣的介面設計會產生外在認知負荷，從而損害知識獲取。)"}, {"word": "Germane", "pos": "adj.", "phonetic": "[dʒɚˋmen]", "meaning": "密切相關的；有助益的（認知負荷理論指真正用於建構心智基模與促進深度學習的有效負荷）", "collocations": [{"en": "germane cognitive load", "zh": "增惠認知負荷"}, {"en": "germane schema construction", "zh": "有效的基模建構"}, {"en": "highly germane to the topic", "zh": "與主題密切相關"}], "toefl_app": "認知負荷理論核心專門術語。例：'Effective pedagogy minimizes extraneous load to maximize cognitive bandwidth for germane learning.' (有效的教學法盡量減少外在負荷，以最大化用於增惠學習的認知頻寬。)"}, {"word": "Scaffolding", "pos": "n.", "phonetic": "[ˋskæf!dɪŋ]", "meaning": "鷹架支援；輔助支架（教育心理學指逐步引導、隨著能力 let currentUnitIndex = 0;
const audio = document.getElementById('audioPlayer');
const playBtn = document.getElementById('playBtn');

function initApp() {
    const listContainer = document.getElementById('unitList');
    UNITS_DATA.forEach((u, idx) => {
        const card = document.createElement('div');
        card.className = `unit-card ${idx === 0 ? 'active' : ''}`;
        card.onclick = () => selectUnit(idx);
        card.innerHTML = `
            <div class="unit-tag">Unit ${String(u.num).padStart(2, '0')} ‧ ${u.domain.substring(3)}</div>
            <div class="unit-name">${u.title}</div>
            <div class="unit-meta">${u.suggested_pace.split('｜')[0]}</div>
        `;
        listContainer.appendChild(card);
    });

    // Check URL parameters or hash
    let initialIdx = 0;
    const urlParams = new URLSearchParams(window.location.search);
    const unitParam = urlParams.get('unit');
    if (unitParam) {
        const uNum = parseInt(unitParam, 10);
        const found = UNITS_DATA.findIndex(u => u.num === uNum);
        if (found !== -1) initialIdx = found;
    } else {
        const hash = window.location.hash.toLowerCase();
        const match = hash.match(/unit(\d+)/);
        if (match) {
            const uNum = parseInt(match[1], 10);
            const found = UNITS_DATA.findIndex(u => u.num === uNum);
            if (found !== -1) initialIdx = found;
        }
    }
    selectUnit(initialIdx);
}

function selectUnit(idx) {
    document.querySelectorAll('.unit-card').forEach((c, i) => {
        c.classList.toggle('active', i === idx);
    });
    loadUnit(idx);
}

function loadUnit(idx) {
    currentUnitIndex = idx;
    const u = UNITS_DATA[idx];
    document.getElementById('dispTitle').innerText = `Unit ${String(u.num).padStart(2, '0')}: ${u.title}`;
    document.getElementById('dispSubtitle').innerText = u.chinese_title;
    document.getElementById('dispSpeaker').innerText = `🎤 ${u.speaker} ｜ ${u.suggested_pace}`;
    document.getElementById('qrDisplay').src = u.qrPath;
    
    audio.src = u.audioPath;
    audio.load();
    playBtn.innerText = '▶';
    
    renderPassageTab(u);
    renderTransTab(u);
    renderQuestionsTab(u);
    renderAnswersTab(u);
    renderVocabTab(u);
}

function renderPassageTab(u) {
    let html = `<div style="font-size: 0.85rem; color: var(--accent-blue); font-weight: 700; margin-bottom: 14px;">${u.chapter_part} ‧ 標準學術文章正文</div>`;
    u.paragraphs.forEach(p => {
        let textFormatted = p.text.replace(/\[■\s*([A-D])\]/g, '<span class="insert-marker">[■ $1]</span>');
        html += `
            <div class="passage-para">
                <span class="para-label">Paragraph ${p.letter}</span>
                ${textFormatted}
            </div>
        `;
    });
    document.getElementById('passageContent').innerHTML = html;
}

function renderTransTab(u) {
    let html = `<div style="font-size: 0.85rem; color: var(--accent-blue); font-weight: 700; margin-bottom: 14px;">段落逐段雙語精準對照</div>`;
    u.paragraphs.forEach(p => {
        html += `
            <div class="trans-card">
                <div style="font-weight: 800; color: var(--deep-sky); margin-bottom: 4px;">Paragraph ${p.letter}・${p.summary}</div>
                <div class="trans-en">${p.text}</div>
                <div class="trans-zh">${p.chinese}</div>
            </div>
        `;
    });
    document.getElementById('transContent').innerHTML = html;
}

function renderQuestionsTab(u) {
    let html = `<div style="font-size: 0.85rem; color: var(--accent-blue); font-weight: 700; margin-bottom: 14px;">托福官方八大題型深度實戰（10 題標準測驗）</div>`;
    u.questions.forEach((q, qIdx) => {
        html += `
            <div class="question-card" id="q_card_${qIdx}">
                <div class="q-header">
                    <span class="q-num">Question ${q.num}</span>
                    <span class="q-type">${q.type}</span>
                </div>
                <div class="q-prompt">${q.prompt}</div>
                <ul class="opt-list">
        `;
        q.options.forEach(opt => {
            html += `<li class="opt-item" onclick="selectOption(this, ${qIdx})">${opt}</li>`;
        });
        html += `
                </ul>
                <button class="btn-reveal" onclick="toggleAnswer(${qIdx})">💡 查看本題答案與考點</button>
                <div class="q-ans-box" id="ans_box_${qIdx}">
                    <div class="q-ans-title">✓ 正確答案：${Array.isArray(q.correct) ? q.correct.join(', ') : q.correct}</div>
                    <div>${q.explanation || '詳解請見【考點手術刀詳解】標籤頁'}</div>
                </div>
            </div>
        `;
    });
    document.getElementById('questionsContent').innerHTML = html;
}

function selectOption(el, qIdx) {
    const parent = el.parentElement;
    parent.querySelectorAll('.opt-item').forEach(li => li.classList.remove('selected'));
    el.classList.add('selected');
}

function toggleAnswer(qIdx) {
    const box = document.getElementById(`ans_box_${qIdx}`);
    if (box.style.display === 'block') {
        box.style.display = 'none';
    } else {
        box.style.display = 'block';
    }
}

function renderAnswersTab(u) {
    let html = `<div style="font-size: 0.85rem; color: var(--accent-blue); font-weight: 700; margin-bottom: 14px;">10 題考點手術刀定位與干擾項排除邏輯</div>`;
    u.questions.forEach(q => {
        html += `
            <div class="exp-card">
                <div class="exp-num">Question ${q.num} ｜ 題型：${q.type} ｜ 正確答案：${Array.isArray(q.correct) ? q.correct.join(', ') : q.correct}</div>
                <div class="exp-detail"><b>⚡ 考點手術刀詳解：</b>${q.explanation || ''}</div>
            </div>
        `;
    });
    
    if (u.paraphrase_list && u.paraphrase_list.length > 0) {
        html += `
            <div style="font-size: 0.85rem; color: var(--accent-blue); font-weight: 700; margin: 24px 0 10px 0;">托福 30 滿分考官「極限同義替換映射矩陣」</div>
            <table class="para-table">
                <thead>
                    <tr>
                        <th style="width: 30%;">篇章關鍵原詞 / 表達</th>
                        <th style="width: 35%;">考官同義替換變形</th>
                        <th style="width: 35%;">認知維度分析</th>
                    </tr>
                </thead>
                <tbody>
        `;
        u.paraphrase_list.forEach(p => {
            html += `
                <tr>
                    <td><b>${p.orig}</b></td>
                    <td style="color: var(--accent-blue); font-weight: 600;">${p.para}</td>
                    <td>${p.category}</td>
                </tr>
            `;
        });
        html += `</tbody></table>`;
    }
    document.getElementById('answersContent').innerHTML = html;
}

function renderVocabTab(u) {
    let html = `
        <div style="font-size: 0.85rem; color: var(--accent-blue); font-weight: 700; margin-bottom: 14px;">TOEFL 高階學術核心詞彙庫（Collocations 雙欄檢核）</div>
        <div class="vocab-grid">
    `;
    u.vocab_list.forEach(v => {
        html += `
            <div class="vocab-card">
                <div class="vocab-word">${v.word} <span style="font-size:0.75rem; color:#64748B;">${v.pos} ${v.phonetic}</span></div>
                <div class="vocab-def">${v.meaning}</div>
                <div class="vocab-colloc"><b>搭配詞：</b>${v.collocations}</div>
                ${v.toefl_app ? `<div class="vocab-app"><b>TOEFL 考點：</b>${v.toefl_app}</div>` : ''}
            </div>
        `;
    });
    html += `</div>`;
    
    if (u.grammar_list && u.grammar_list.length > 0) {
        html += `<div style="font-size: 0.85rem; color: var(--accent-blue); font-weight: 700; margin: 24px 0 12px 0;">學術長難句 SVO 結構解剖與可遷移寫作公式</div>`;
        u.grammar_list.forEach((g, gIdx) => {
            html += `
                <div class="exp-card" style="margin-bottom: 14px;">
                    <div class="exp-num">長難句解剖 #${gIdx + 1}</div>
                    <div style="font-family: Georgia, serif; font-size: 0.95rem; color: #0F2744; margin: 4px 0;">“${g.sentence}”</div>
                    <div class="exp-detail" style="margin-top: 6px;"><b>【語法結構拆解】：</b>${g.breakdown}</div>
                    <div class="exp-detail"><b>【中文精準翻譯】：</b>${g.translation}</div>
                    <div class="exp-detail" style="color: #0284C7;"><b>【高階寫作公式】：</b>${g.formula}</div>
                    ${g.application ? `<div class="exp-detail" style="color: #15803D;"><b>【可遷移實戰造句】：</b>${g.application}</div>` : ''}
                </div>
            `;
        });
    }
    document.getElementById('vocabContent').innerHTML = html;
}

function togglePlay() {
    if (audio.paused) {
        audio.play();
        playBtn.innerText = '⏸';
    } else {
        audio.pause();
        playBtn.innerText = '▶';
    }
}

function skipTime(sec) {
    audio.currentTime = Math.max(0, Math.min(audio.duration, audio.currentTime + sec));
}

function jumpTo(sec) {
    audio.currentTime = sec;
    if (audio.paused) {
        audio.play();
        playBtn.innerText = '⏸';
    }
}

function changeSpeed(val) {
    audio.playbackRate = parseFloat(val);
}

function updateProgress() {
    if (!audio.duration) return;
    const progress = (audio.currentTime / audio.duration) * 100;
    document.getElementById('scrubber').value = progress;
    document.getElementById('currentTime').innerText = formatTime(audio.currentTime);
    document.getElementById('totalTime').innerText = formatTime(audio.duration);
}

function seekAudio(val) {
    if (!audio.duration) return;
    audio.currentTime = (val / 100) * audio.duration;
}

function onAudioEnded() {
    playBtn.innerText = '▶';
}

function formatTime(sec) {
    const m = Math.floor(sec / 60);
    const s = Math.floor(sec % 60);
    return `${m}:${s < 10 ? '0' : ''}${s}`;
}

function switchTab(tabId, btn) {
    document.querySelectorAll('.tab-pane').forEach(p => p.classList.remove('active'));
    document.querySelectorAll('.tab-btn').forEach(b => b.classList.remove('active'));
    document.getElementById(tabId).classList.add('active');
    btn.classList.add('active');
}

window.onload = initApp;
</script>
