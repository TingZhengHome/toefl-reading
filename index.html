口充斥著免費的廢煤。選項 B 正確。"}, {"num": "5", "type": "Inference", "stem": "Which of the following can be inferred from paragraph 4 about the consequence of shifting from waterpower to rotary steam power?", "options": ["A. Textile manufacturing became permanently restricted to mountain river streams during summer months.", "B. Factories could abandon remote rural waterways and concentrate in urban centers with abundant labor and transport links.", "C. Steam engines completely stopped functioning whenever coal prices fluctuated.", "D. Textile workers refused to relocate to cities because urban factories were colder than rural workshops."], "correct": "B", "explanation": "定位段落 4 末尾：'Steam engines completely emancipated industrial manufacturing from riparian geography, allowing textile mills to relocate to urban centers near deep harbors, coal basins, and abundant pools of factory labor.' 這說明工廠從依附偏遠河流中解放出來，能夠集中於勞動力充沛且交通便利的城市中心。選項 B 正確。A 與事實相反；C、D 偏離原文。"}, {"num": "6", "type": "Vocabulary in Context", "stem": "The word \"emancipated\" in paragraph 4 is closest in meaning to:", "options": ["A. liberated", "B. protected", "C. prohibited", "D. detached"], "correct": "A", "explanation": "段落 4 語境：'Steam engines completely emancipated industrial manufacturing from riparian geography...'，emancipate 意為「解放、使脫離束縛」。選項 A (liberated, 解放了) 為最精準同義詞。B (protected, 保護)、C (prohibited, 禁止)、D (detached, 分離) 均不如 liberated 貼合此處歷史與經濟語境。"}, {"num": "7", "type": "Factual Information", "stem": "According to paragraph 5, how did the adoption of steam boilers transform the daily organization of industrial labor?", "options": ["A. Workers were granted complete freedom to choose their daily hours based on seasonal daylight.", "B. High capital costs demanded non-stop operation, synchronizing labor to mechanical clock time with rigid shifts and fines.", "C. Factory owners eliminated all financial wages in favor of direct barley ration handouts.", "D. Industrial machines were operated exclusively by wild animals rather than human wage-laborers."], "correct": "B", "explanation": "定位段落 5：'the immense fixed capital costs of steam boilers demanded continuous, relentless operation. Labor became synchronized to the mechanical rhythm of the engine, giving birth to punch-clocks, rigid twelve-hour shifts, and severe punitive fines for tardiness.' 選項 B 完整重現了高昂資本要求機器不間斷運轉、勞動與機械時鐘同步並實施嚴格輪班罰款的論述。A、C、D 均荒謬不符。"}, {"num": "8", "type": "Sentence Simplification", "target_sentence": "By keeping the main piston cylinder permanently heated while condensing steam in an auxiliary refrigerated chamber, Watt slashed fuel consumption by over seventy-five percent.", "stem": "Which of the sentences below best expresses the essential information in the highlighted sentence in paragraph 3? Incorrect choices change the meaning in important ways or leave out essential information.", "options": ["A. Watt dramatically reduced steam engine fuel usage by cooling steam in a separate auxiliary chamber instead of repeatedly cooling the main cylinder.", "B. Fuel consumption increased by seventy-five percent because Watt added a secondary refrigeration cylinder that required constant reheating.", "C. The main cylinder was abandoned entirely because cooling steam inside the boiler produced fatal boiler explosions.", "D. Watt's condenser was commercially unsuccessful because auxiliary metal chambers were too expensive to manufacture."], "correct": "A", "explanation": "原句核心邏輯：透過保持主汽缸恆溫而在獨立的輔助冷卻室冷凝蒸汽（By keeping the main cylinder permanently heated while condensing steam in an auxiliary chamber）+ 瓦特將燃料消耗降低了超過百分之七十五（Watt slashed fuel consumption by over seventy-five percent）。選項 A 精準改寫了『在獨立腔室冷凝蒸汽以避免主汽缸反覆冷卻，從而大幅降低燃料消耗』的核心機制與結果。B 顛倒了節省燃料為增加燃料；C、D 捏造爆炸與商業失敗。"}, {"num": "9", "type": "Text Insertion", "insert_sentence": "This breakthrough severed the spatial tether that had bound mechanical production to running water for millennia.", "stem": "Look at the four squares [■] that indicate where the following sentence could be added to paragraph 4.\n\n\"This breakthrough severed the spatial tether that had bound mechanical production to running water for millennia.\"\n\nWhere would the sentence best fit?", "options": ["A. [■ A]", "B. [■ B]", "C. [■ C]", "D. [■ D]"], "correct": "D", "explanation": "段落 4 在 [■ C] 之後描述水力紡織機過去受制於偏遠河谷，水力在地理上不可移動且受乾旱凍結影響：'Prior to rotary steam engines, spinning mules and power looms were inexorably tethered to rapid, remote rural river valleys... Waterpower was geographically immobile and seasonally vulnerable...' 待插入句 'This breakthrough severed the spatial tether that had bound mechanical production to running water for millennia.'（這項突破斬斷了數千年來將機械生產束縛於流水之旁的空間枷鎖），以 'This breakthrough' 與 'severed the spatial tether' 承接上句對流水束縛的描述，並為後一句 [■ D] 之後的總結：'Steam engines completely emancipated industrial manufacturing from riparian geography, allowing textile mills to relocate to urban centers...' 提供完美的邏輯鋪墊。插入在 [■ D] 處最為精準通順。"}, {"num": "10", "type": "Prose Summary", "intro": "The British Industrial Revolution replaced the organic energy regime with subterranean coal energetics, fostering unprecedented mechanical productivity, urbanization, and social restructuring.", "stem": "An introductory sentence for a brief summary of the passage is provided above. Complete the summary by selecting the THREE answer choices that express the most important ideas in the passage. Some sentences do not belong in the summary because they express ideas that are not presented in the passage or are minor ideas in the passage. This question is worth 2 points.", "options": ["A. Exploiting ancient coal deposits liberated human society from zero-sum surface agricultural land constraints and Malthusian stagnation.", "B. James Watt's separate condenser and rotary gear mechanisms transformed inefficient mine drainage pumps into universal power sources that emancipated factories from rivers.", "C. Concentrating steam factories in cities imposed synchronized mechanical time discipline on workers and fueled the explosive growth of industrial metropolises.", "D. Thomas Newcomen proved that atmospheric pressure is incapable of moving metal pistons in temperatures below 20°C.", "E. British textile mills were forced to revert back to animal-drawn plows because coal combustion produced zero thermal energy.", "F. The British government outlawed the construction of railways to protect rural horse breeders from economic competition."], "correct": ["A", "B", "C"], "explanation": "選項 A 概括了開採煤炭如何使人類擺脫有機能源體系與土地零和博弈的天花板（段落 1 與 2）；選項 B 概括了瓦特分離冷凝器與旋轉機構如何將蒸汽機轉化為解放工廠地理束縛的通用動力（段落 3 與 4）；選項 C 概括了工廠進城帶來的機械時間紀律與無產階級都市化集聚（段落 5 與 6）。D 荒唐否定大氣活塞；E 捏造紡織廠重返畜力；F 捏造政府禁止鐵路。"}], "detailed_answers": [], "vocab_list": [], "paraphrase_pairs": [], "grammar_breakdown": []}, {"num": 10, "domain": "10_認知心理學與人類記憶架構", "title": "Working Memory Architecture and Dual-Process Cognition", "chinese_title": "工作記憶架構與雙歷程認知：心智頻寬的極限與理性決策模型", "chapter_part": "【第三篇章 ‧ 歷史考古、人類文明與心智認知】", "suggested_pace": "⏱ 考場建議模考配速：18 分鐘 ｜ 標準測驗題量：10 題 ｜ 難度權重：TOEFL iBT 滿分標竿篇章", "speaker": "Dr. Jenny Holbrook (American Academic Female)", "audioPath": "./audio/Unit10_Working_Memory_and_Dual_Process_Cognition.mp3", "qrPath": "./qr/QR_Unit10.png", "paragraphs": [{"letter": "1", "summary": "The shift from static short-term stores to dynamic working memory", "text": "For much of the mid-twentieth century, cognitive psychology conceptualized human memory through linear, unitary models—most notably Richard Atkinson and Richard Shiffrin's 1968 multi-store framework. In this classical paradigm, incoming sensory data was briefly retained in a passive 'short-term memory' buffer before being either transferred to permanent long-term storage or forgotten entirely. By the early 1970s, however, experimental anomalies accumulated: patients with severe short-term memory deficits could nonetheless comprehend complex linguistic syntax and solve abstract spatial puzzles. In 1974, British psychologists Alan Baddeley and Graham Hitch proposed a revolutionary departure: memory is not an inert holding pen, but an active, multicomponent 'working memory' architecture that concurrently manipulates, transforms, and temporarily maintains information to execute complex cognitive tasks.", "chinese": "在二十世紀中葉的大部分時間裡，認知心理學透過線性、單一的模型來概念化人類記憶——最著名的是理查德·阿特金森（Richard Atkinson）與理查德·希夫林（Richard Shiffrin）於 1968 年提出的多存儲框架。在這種古典典範中，傳入的感官數據在被轉移到永久的長期記憶存儲或被徹底遺忘之前，會被短暫地保留在一個被動的「短期記憶」緩衝區中。然而，到了 1970 年代初，實驗上的反常現象不斷累積：患有嚴重短期記憶缺陷的患者，卻依然能夠理解複雜的語言語法並解決抽象的空間難題。1974 年，英國心理學家阿蘭·巴德利（Alan Baddeley）與格雷厄姆·希奇（Graham Hitch）提出了一項革命性的轉向：記憶並非一個惰性的暫存圈，而是一個主動的、多成分的「工作記憶（working memory）」架構，它能同時操縱、轉換並暫時維護資訊，以執行複雜的認知任務。"}, {"letter": "2", "summary": "The multicomponent model: Slave systems and executive control", "text": "Baddeley and Hitch's multicomponent model decomposed working memory into a supervising attentional controller and specialized subsidiary slave systems. At the apex sits the central executive, a modality-free supervisory system responsible for focusing attention, dividing processing capacity, switching cognitive sets, and inhibiting task-irrelevant impulses. Assisting the central executive are two domain-specific storage buffers: the phonological loop, which processes acoustic and verbal data through subvocal rehearsal, and the visuospatial sketchpad, which visualizes, manipulates, and tracks spatial arrays and mental imagery. In 2000, Baddeley augmented this model by introducing the 'episodic buffer'—a limited-capacity multimodal interface that binds information from the subsidiary slave systems, perceptual modalities, and long-term memory into integrated, coherent chronological episodes.", "chinese": "巴德利與希奇的多成分模型將工作記憶分解為一個起主導監控作用的注意控制中樞與專門化的附屬從屬系統。位居頂點的是「中央執行系統（central executive）」，這是一個非特定模態的監控系統，負責聚焦注意力、分配處理容量、切換認知定勢，以及抑制與任務無關的衝動。協助中央執行系統的是兩個特定領域的存儲緩衝區：透過默讀演練處理聲學與言語數據的「語音迴路（phonological loop）」，以及視覺化、操縱並追蹤空間陣列與心智表象的「視覺空間素描板（visuospatial sketchpad）」。2000 年，巴德利透過引入「情節緩衝區（episodic buffer）」完善了該模型——這是一個容量有限的多模態介面，能將來自從屬系統、知覺模態與長期記憶的資訊綁定為整合、連貫且具時間順序的情節事件。"}, {"letter": "3", "summary": "Dual-process theory: System 1 intuition versus System 2 deliberation", "text": "Working memory capacity functions as the critical anatomical bottleneck that bridges cognitive architecture with dual-process theories of human judgment. Advanced by psychologists Daniel Kahneman and Amos Tversky, dual-process theory posits that human thinking is governed by two fundamentally distinct modes of information processing: System 1 and System 2. System 1 operates automatically, effortlessly, and rapidly, relying on associative memory, affective heuristics, and evolutionary evolutionary shortcuts to generate swift impressions and instinctive reactions. It requires virtually zero conscious effort and consumes negligible working memory bandwidth. In stark contrast, System 2 is slow, deliberative, sequential, and intensely demanding, mobilizing conscious executive attention to perform complex calculations, evaluate logical syllogisms, and override impulsive biases.", "chinese": "工作記憶容量作為關鍵的解剖學生理瓶頸，將認知架構與人類判斷的「雙歷程理論（dual-process theory）」銜接起來。由心理學家丹尼爾·康納曼（Daniel Kahneman）與阿摩司·特沃斯基（Amos Tversky）所推進的雙歷程理論主張，人類思維受制於兩種截然不同的資訊處理模式：系統一（System 1）與系統二（System 2）。系統一自動、輕鬆且迅速地運作，依賴聯想記憶、情感啟發式經驗與演化捷徑來產生迅速的印象與本能反應。它幾乎不需要有意識的努力，且消耗微不足道的工作記憶頻寬。與此形成鮮明對比的是，系統二是緩慢、深思熟慮、順序推進且極度耗能的，它動員有意識的執行注意力來執行複雜的計算、評估邏輯三段論，並壓制衝動性的偏誤。"}, {"letter": "4", "summary": "Cognitive load theory and intrinsic mental limits", "text": "[■ A] Because the central executive and System 2 deliberation draw upon a strictly finite metabolic reservoir of working memory capacity, the brain is perpetually susceptible to 'cognitive overload.' [■ B] Formulated by educational psychologist John Sweller, cognitive load theory identifies three distinct demands on working memory: intrinsic load, extraneous load, and germane load. [■ C] Intrinsic load is dictated by the inherent element interactivity of the material itself. Extraneous load, conversely, represents useless mental friction generated by poorly designed instructions, confusing visual layouts, or ambient distractions. [■ D] When extraneous load encroaches upon working memory capacity, the brain lacks the cognitive bandwidth required for germane load—the active mental schema construction and deep integration into long-term memory.", "chinese": "[■ A] 由於中央執行系統與系統二的深思熟慮仰賴於嚴格有限的工作記憶代謝容量庫，大腦因而始終容易遭遇「認知過載（cognitive overload）」。[■ B] 由教育心理學家約翰·斯韋勒（John Sweller）提出的「認知負荷理論」，指出了施加在工作記憶上的三種截然不同的需求：內在負荷、外在負荷與增惠負荷。[■ C] 內在負荷由材料本身的固有要素交互作用度所決定。相反地，外在負荷代表由設計不良的教學指引、混亂的視覺排版或環境干擾所產生的無效心智摩擦。[■ D] 當外在負荷侵佔工作記憶容量時，大腦便缺乏進行增惠負荷所需的心智頻寬——即主動建構心智基模並將其深度整合入長期記憶的過程。"}, {"letter": "5", "summary": "Scarcity, bandwidth tax, and behavioral consequences", "text": "The real-world ramifications of working memory exhaustion extend far beyond educational settings, profoundly influencing socioeconomic decision-making. Pioneering behavioral economists Sendhil Mullainathan and Eldar Shafir have demonstrated that conditions of acute poverty or chronic financial insecurity impose an involuntary 'bandwidth tax' on the human mind. The persistent, intrusive preoccupation with meeting basic subsistence needs—such as calculating how to pay rent or secure daily food—monopolizes precious central executive resources. Depleted of working memory capacity, individuals are effectively forced to rely on intuitive System 1 heuristics, impairing their ability to resist immediate gratification, execute long-term financial planning, or suppress cognitive biases, thus trapping disadvantaged populations in self-reinforcing poverty cycles.", "chinese": "工作記憶枯竭在現實世界中的影響遠遠超出了教育環境，深刻地影響著社會經濟決策。開創性的行為經濟學家森迪爾·穆拉伊納坦（Sendhil Mullainathan）與埃爾達爾·沙菲爾（Eldar Shafir）已經證明，極端貧困或長期的經濟不安全感會對人類心智徵收一種非自願的「心智頻寬稅（bandwidth tax）」。對滿足基本生存需求（例如計算如何支付房租或獲取每日食物）的持續、侵入性焦慮，壟斷了寶貴的中央執行資源。在工作記憶容量被消耗殆盡的情況下，個體實際上被迫依賴直覺性的系統一啟發式經驗，削弱了他們抵禦即時滿足、執行長期財務規劃或壓制認知偏誤的能力，從而將弱勢群體困在自我強化的貧困循環之中。"}, {"letter": "6", "summary": "Metacognitive scaffolding and cognitive optimization", "text": "Recognizing the biological constraints of working memory architecture enables the development of proactive metacognitive scaffolding. To prevent System 1 heuristic errors and alleviate working memory bottlenecks, decision architects and educators increasingly rely on 'externalized cognition'—offloading mental burdens onto structured checklists, external algorithmic aids, and visual organizers. Furthermore, through deliberate practice and automated chunking, complex multidimensional tasks can be compressed into integrated schematic units that require minimal conscious processing. Ultimately, human cognitive mastery resides not in an infinite capacity for internal calculation, but in the strategic, ergonomic management of our strictly finite working memory bandwidth.", "chinese": "認識到工作記憶架構的生物學局限性，使得發展前瞻性的後設認知鷹架成為可能。為了防止系統一的啟發式偏誤並緩解工作記憶瓶頸，決策架構師與教育工作者日益依賴「外化認知（externalized cognition）」——將心智負擔卸載至結構化檢核表、外部演算法輔助工具與視覺組織圖之上。此外，透過刻意練習與自動化組塊（chunking），複雜的多維度任務可以被壓縮成只需要極少意識處理的整合基模單元。歸根結底，人類的認知卓越並不在於擁有無限的內部計算容量，而在於對我們嚴格有限的工作記憶頻寬進行策略性、人體工學式的管理。"}], "questions": [{"num": "1", "type": "Factual Information", "stem": "According to paragraph 1, what experimental anomaly disproved the classical multi-store model of short-term memory?", "options": ["A. Brain-damaged patients completely forgot their native languages while retaining memories of foreign vocabularies.", "B. Patients with severe short-term memory deficits could still understand complex grammar and solve abstract spatial problems.", "C. Healthy adults were found to possess infinite storage capacities for auditory phonological sequences.", "D. Long-term memory was proven to store sensory information for fewer than five milliseconds."], "correct": "B", "explanation": "定位段落 1：'patients with severe short-term memory deficits could nonetheless comprehend complex linguistic syntax and solve abstract spatial puzzles.' 選項 B 精確指出了短期記憶嚴重受損的患者仍能理解複雜語法並解決空間難題，這一反常現象直接推翻了被動短期記憶假說。A、C、D 均與原文相悖。"}, {"num": "2", "type": "Negative Factual (NOT / EXCEPT)", "stem": "According to paragraph 2, all of the following are components of Baddeley and Hitch's working memory model EXCEPT:", "options": ["A. The central executive that focuses attention and switches cognitive sets", "B. The phonological loop that processes verbal data via subvocal rehearsal", "C. The visceral autonomic nervous plexus that directly digests physical proteins", "D. The visuospatial sketchpad that manipulates spatial arrays and mental imagery"], "correct": "C", "explanation": "定位段落 2：巴德利的多成分模型包含：中央執行系統（A）、語音迴路（B）、視覺空間素描板（D）以及情節緩衝區。選項 C 提及消化蛋白質的內臟自律神經叢，屬生理消化系統而非工作記憶認知組件，為正確答案。"}, {"num": "3", "type": "Vocabulary in Context", "stem": "The word \"impulsive\" in paragraph 3 is closest in meaning to:", "options": ["A. spontaneous", "B. calculated", "C. permanent", "D. academic"], "correct": "A", "explanation": "段落 3 語境：'override impulsive biases'，impulsive 意為「衝動的、本能的、自發未經思索的」。選項 A (spontaneous, 自發衝動的、未經深思熟慮的) 最為接近。B (calculated, 精心計算的)、C (permanent, 永久的)、D (academic, 學術的) 均不符合詞義。"}, {"num": "4", "type": "Rhetorical Purpose", "stem": "Why does the author contrast System 1 and System 2 in paragraph 3?", "options": ["A. To argue that System 1 should be completely eliminated from the human brain through surgical intervention", "B. To illustrate how working memory capacity acts as the critical bottleneck separating fast, automatic intuition from slow, effortful deliberation", "C. To prove that System 2 consumes no physiological energy or glucose", "D. To demonstrate that emotional feelings play no role in human decision-making"], "correct": "B", "explanation": "定位段落 3 第一句：'Working memory capacity functions as the critical anatomical bottleneck that bridges cognitive architecture with dual-process theories of human judgment.' 作者對比系統一與系統二，旨在闡明工作記憶容量如何作為關鍵瓶頸，將自動快速的直覺系統與緩慢、高度消耗工作記憶的深思熟慮系統區分開來。選項 B 正確。"}, {"num": "5", "type": "Inference", "stem": "Which of the following can be inferred from paragraph 4 about the relationship between extraneous load and learning effectiveness?", "options": ["A. Reducing extraneous load by organizing instructional materials cleanly frees up working memory bandwidth for constructing mental schemas.", "B. High extraneous load is necessary to force students to expand their total short-term memory capacity.", "C. Intrinsic load can be permanently eliminated if extraneous load is increased to maximum levels.", "D. Germane load occurs exclusively when learners are deprived of all visual diagrams."], "correct": "A", "explanation": "定位段落 4：'When extraneous load encroaches upon working memory capacity, the brain lacks the cognitive bandwidth required for germane load—the active mental schema construction...' 這說明減少外在負荷（消除不良排版或混亂干擾）能夠騰出工作記憶頻寬，讓大腦專注於增惠負荷（建構心智基模）。選項 A 為最精準合理的推論。"}, {"num": "6", "type": "Vocabulary in Context", "stem": "The word \"encroaches\" in paragraph 4 is closest in meaning to:", "options": ["A. intrudes", "B. multiplies", "C. stabilizes", "D. disappears"], "correct": "A", "explanation": "段落 4 語境：'When extraneous load encroaches upon working memory capacity...'，encroach upon 意為「侵佔、侵蝕、侵犯」。選項 A (intrudes, 侵入、侵擾) 為最精確同義詞。B (multiplies, 增加)、C (stabilizes, 穩定)、D (disappears, 消失) 均不符合。"}, {"num": "7", "type": "Factual Information", "stem": "According to paragraph 5, how does the psychological experience of chronic poverty impose a \"bandwidth tax\" on cognitive functioning?", "options": ["A. By causing physical atrophy in the auditory bones of the inner ear", "B. By monopolizing central executive working memory resources with constant anxieties over immediate subsistence needs", "C. By permanently preventing the phonological loop from processing spoken vocabulary", "D. By accelerating the transition of all memories directly into permanent long-term storage"], "correct": "B", "explanation": "定位段落 5：'conditions of acute poverty... impose an involuntary \"bandwidth tax\" on the human mind. The persistent, intrusive preoccupation with meeting basic subsistence needs... monopolizes precious central executive resources. Depleted of working memory capacity, individuals are effectively forced to rely on intuitive System 1 heuristics...' 選項 B 精確重現了生存焦慮壟斷中央執行工作記憶資源的核心論點。A、C、D 均屬無稽之談。"}, {"num": "8", "type": "Sentence Simplification", "target_sentence": "Recognizing that human cognitive mastery resides not in an infinite capacity for internal calculation, but in the strategic, ergonomic management of our strictly finite working memory bandwidth enables the design of effective externalized aids.", "stem": "Which of the sentences below best expresses the essential information in the highlighted sentence in paragraph 6? Incorrect choices change the meaning in important ways or leave out essential information.", "options": ["A. Effective cognitive tools can be created once we understand that true mental capability depends on wisely managing strictly limited working memory rather than on possessing limitless computing power.", "B. Human beings possess unlimited internal calculation capacity that eliminates the need for any ergonomic external aids.", "C. Strategic management of working memory bandwidth is only possible for individuals who have memorized infinite mathematical equations.", "D. Externalized tools should be banned because human cognitive mastery requires exclusively internal mental computations."], "correct": "A", "explanation": "原句核心邏輯：認識到人類認知優勢不在於無限內部計算（resides not in an infinite capacity for internal calculation）+ 而在於策略性管理嚴格有限的工作記憶頻寬（but in the strategic, ergonomic management of finite working memory）+ 促成了有效外化工具的設計（enables the design of effective externalized aids）。選項 A 精準改寫了『智力不在於無限算力，而在於明智管理有限工作記憶，從而促進外化工具設計』的主旨。B 與原文相反；C 偏離文意；D 荒謬主張禁止外化工具。"}, {"num": "9", "type": "Text Insertion", "insert_sentence": "Consequently, working memory is not a passive sponge, but an energetic cognitive bottleneck.", "stem": "Look at the four squares [■] that indicate where the following sentence could be added to paragraph 4.\n\n\"Consequently, working memory is not a passive sponge, but an energetic cognitive bottleneck.\"\n\nWhere would the sentence best fit?", "options": ["A. [■ A]", "B. [■ B]", "C. [■ C]", "D. [■ D]"], "correct": "A", "explanation": "段落 3 結尾介紹了系統一與系統二對工作記憶的不同要求，指出系統二極度耗能。段落 4 開頭 [■ A] 緊接著：'Because the central executive and System 2 deliberation draw upon a strictly finite metabolic reservoir of working memory capacity, the brain is perpetually susceptible to cognitive overload.' 待插入句 'Consequently, working memory is not a passive sponge, but an energetic cognitive bottleneck.'（因此，工作記憶並非被動的海綿，而是一個高能耗的認知瓶頸），以 Consequently 作為承接上文的總結，精準駁斥了海綿被動說並點出『高能耗認知瓶頸』，恰好置於 [■ A] 處作為段落總起句。插入在 [■ A] 最為有力。"}, {"num": "10", "type": "Prose Summary", "intro": "Working memory is a limited-capacity, multicomponent system that governs human reasoning, dictates dual-process decision modes, and shapes socioeconomic behavior.", "stem": "An introductory sentence for a brief summary of the passage is provided above. Complete the summary by selecting the THREE answer choices that express the most important ideas in the passage. Some sentences do not belong in the summary because they express ideas that are not presented in the passage or are minor ideas in the passage. This question is worth 2 points.", "options": ["A. Baddeley and Hitch's model replaced static short-term storage with an active central executive and specialized slave buffers (phonological loop and visuospatial sketchpad).", "B. Working memory capacity divides fast, automatic System 1 intuition from slow, metabolically demanding System 2 deliberative thought.", "C. Cognitive load theory and the \"bandwidth tax\" of poverty reveal how mental exhaustion impairs rational decision-making by forcing reliance on heuristic shortcuts.", "D. Sendhil Mullainathan proved that human beings can completely eliminate all cognitive biases by consuming excess glucose drinks.", "E. John Sweller demonstrated that the phonological loop can retain verbal information permanently without requiring any rehearsal.", "F. Atkinson and Shiffrin invented punch-clocks to measure the exact millisecond duration of human long-term memories."], "correct": ["A", "B", "C"], "explanation": "選項 A 概括了巴德利多成分工作記憶模型對古典靜態記憶模型的革新（段落 1 與 2）；選項 B 概括了工作記憶容量作為系統一與系統二雙歷程思維分水嶺的關鍵角色（段落 3）；選項 C 概括了認知負荷理論與貧困心智頻寬稅對理性決策受損的現實影響（段落 4 與 5）。D 捏造喝糖水消除偏誤；E 扭曲語音迴路特徵；F 荒唐把阿特金森與工廠打卡鐘混為一談。"}], "detailed_answers": [], "vocab_list": [], "paraphrase_pairs": [], "grammar_breakdown": []}];

let currentUnitIndex = 0;
const audio = document.getElementById('audioPlayer');
const playBtn = document.getElementById('playBtn');

function initApp() {
    const listContainer = document.getElementById('unitList');
    UNITS_DATA.forEach((u, idx) => {
        const card = document.createElement('div');
        card.className = `unit-card ${idx === 0 ? 'active' : ''}`;
        card.onclick = () => selectUnit(idx);
        card.innerHTML = `
            <div class="unit-tag">Unit ${String(u.num).padStart(2, '0')} ‧ ${u.domain.substring(3)}</div>
            <div class="unit-name">${u.title}</div>
            <div class="unit-meta">${u.suggested_pace.split('｜')[0]}</div>
        `;
        listContainer.appendChild(card);
    });

    // Check URL parameters or hash
    let initialIdx = 0;
    const urlParams = new URLSearchParams(window.location.search);
    const unitParam = urlParams.get('unit');
    if (unitParam) {
        const uNum = parseInt(unitParam, 10);
        const found = UNITS_DATA.findIndex(u => u.num === uNum);
        if (found !== -1) initialIdx = found;
    } else {
        const hash = window.location.hash.toLowerCase();
        const match = hash.match(/unit(\d+)/);
        if (match) {
            const uNum = parseInt(match[1], 10);
            const found = UNITS_DATA.findIndex(u => u.num === uNum);
            if (found !== -1) initialIdx = found;
        }
    }
    selectUnit(initialIdx);
}

function selectUnit(idx) {
    document.querySelectorAll('.unit-card').forEach((c, i) => {
        c.classList.toggle('active', i === idx);
    });
    loadUnit(idx);
}

function loadUnit(idx) {
    currentUnitIndex = idx;
    const u = UNITS_DATA[idx];
    document.getElementById('dispTitle').innerText = `Unit ${String(u.num).padStart(2, '0')}: ${u.title}`;
    document.getElementById('dispSubtitle').innerText = u.chinese_title;
    document.getElementById('dispSpeaker').innerText = `🎤 ${u.speaker} ｜ ${u.suggested_pace}`;
    document.getElementById('qrDisplay').src = u.qrPath;
    
    audio.src = u.audioPath;
    audio.load();
    playBtn.innerText = '▶';
    
    renderPassageTab(u);
    renderTransTab(u);
    renderQuestionsTab(u);
    renderAnswersTab(u);
    renderVocabTab(u);
}

function renderPassageTab(u) {
    let html = `<div style="font-size: 0.85rem; color: var(--accent-blue); font-weight: 700; margin-bottom: 14px;">${u.chapter_part} ‧ 標準學術文章正文</div>`;
    u.paragraphs.forEach(p => {
        let textFormatted = p.text.replace(/\[■\s*([A-D])\]/g, '<span class="insert-marker">[■ $1]</span>');
        html += `
            <div class="passage-para">
                <span class="para-label">Paragraph ${p.letter}</span>
                ${textFormatted}
            </div>
        `;
    });
    document.getElementById('passageContent').innerHTML = html;
}

function renderTransTab(u) {
    let html = `<div style="font-size: 0.85rem; color: var(--accent-blue); font-weight: 700; margin-bottom: 14px;">段落逐段雙語精準對照</div>`;
    u.paragraphs.forEach(p => {
        html += `
            <div class="trans-card">
                <div style="font-weight: 800; color: var(--deep-sky); margin-bottom: 4px;">Paragraph ${p.letter}・${p.summary}</div>
                <div class="trans-en">${p.text}</div>
                <div class="trans-zh">${p.chinese}</div>
            </div>
        `;
    });
    document.getElementById('transContent').innerHTML = html;
}

function renderQuestionsTab(u) {
    let html = `<div style="font-size: 0.85rem; color: var(--accent-blue); font-weight: 700; margin-bottom: 14px;">托福官方八大題型深度實戰（10 題標準測驗）</div>`;
    u.questions.forEach((q, qIdx) => {
        html += `
            <div class="question-card" id="q_card_${qIdx}">
                <div class="q-header">
                    <span class="q-num">Question ${q.num}</span>
                    <span class="q-type">${q.type}</span>
                </div>
                <div class="q-prompt">${q.prompt}</div>
                <ul class="opt-list">
        `;
        q.options.forEach(opt => {
            html += `<li class="opt-item" onclick="selectOption(this, ${qIdx})">${opt}</li>`;
        });
        html += `
                </ul>
                <button class="btn-reveal" onclick="toggleAnswer(${qIdx})">💡 查看本題答案與考點</button>
                <div class="q-ans-box" id="ans_box_${qIdx}">
                    <div class="q-ans-title">✓ 正確答案：${Array.isArray(q.correct) ? q.correct.join(', ') : q.correct}</div>
                    <div>${q.explanation || '詳解請見【考點手術刀詳解】標籤頁'}</div>
                </div>
            </div>
        `;
    });
    document.getElementById('questionsContent').innerHTML = html;
}

function selectOption(el, qIdx) {
    const parent = el.parentElement;
    parent.querySelectorAll('.opt-item').forEach(li => li.classList.remove('selected'));
    el.classList.add('selected');
}

function toggleAnswer(qIdx) {
    const box = document.getElementById(`ans_box_${qIdx}`);
    if (box.style.display === 'block') {
        box.style.display = 'none';
    } else {
        box.style.display = 'block';
    }
}

function renderAnswersTab(u) {
    let html = `<div style="font-size: 0.85rem; color: var(--accent-blue); font-weight: 700; margin-bottom: 14px;">10 題考點手術刀定位與干擾項排除邏輯</div>`;
    if (u.detailed_answers && u.detailed_answers.length > 0) {
        u.detailed_answers.forEach(a => {
            html += `
                <div class="exp-card">
                    <div class="exp-num">Question ${a.num} ｜ 題型：${a.type} ｜ 正確答案：${a.correct}</div>
                    <div class="exp-detail" style="margin-top: 4px;"><b>🎯 考點定位：</b>${a.locator || ''}</div>
                    <div class="exp-detail"><b>🔄 同義替換：</b>${a.paraphrase || ''}</div>
                    <div class="exp-detail"><b>⚡ 詳解剖析：</b>${a.analysis || ''}</div>
                </div>
            `;
        });
    } else {
        u.questions.forEach(q => {
            html += `
                <div class="exp-card">
                    <div class="exp-num">Question ${q.num} ｜ 正確答案：${Array.isArray(q.correct) ? q.correct.join(', ') : q.correct}</div>
                    <div class="exp-detail">${q.explanation || '參閱各單元獨立 PDF 講義第 6 頁題目詳解。'}</div>
                </div>
            `;
        });
    }
    document.getElementById('answersContent').innerHTML = html;
}

function renderVocabTab(u) {
    let html = `
        <div style="font-size: 0.85rem; color: var(--accent-blue); font-weight: 700; margin-bottom: 14px;">TOEFL 高階學術核心詞彙庫（Collocations 雙欄檢核）</div>
        <div class="vocab-grid">
    `;
    u.vocab_list.forEach(v => {
        html += `
            <div class="vocab-card">
                <div class="vocab-word">${v.word} <span style="font-size:0.75rem; color:#64748B;">${v.pos} ${v.phonetic}</span></div>
                <div class="vocab-def">${v.meaning}</div>
                <div class="vocab-colloc"><b>搭配詞：</b>${v.collocations}</div>
            </div>
        `;
    });
    html += `</div>`;
    
    if (u.grammar_breakdown && u.grammar_breakdown.length > 0) {
        html += `<div style="font-size: 0.85rem; color: var(--accent-blue); font-weight: 700; margin: 20px 0 10px 0;">學術長難句 SVO 結構解剖與可遷移寫作公式</div>`;
        u.grammar_breakdown.forEach((g, gIdx) => {
            html += `
                <div class="exp-card" style="margin-bottom: 14px;">
                    <div class="exp-num">長難句解剖 #${gIdx + 1}</div>
                    <div style="font-family: Georgia, serif; font-size: 0.95rem; color: #0F2744; margin: 4px 0;">“${g.sentence}”</div>
                    <div class="exp-detail" style="margin-top: 6px;"><b>【SVO 主幹】：</b>${g.svo}</div>
                    <div class="exp-detail"><b>【修飾成分】：</b>${g.modifiers}</div>
                    <div class="exp-detail"><b>【中文精釋】：</b>${g.translation}</div>
                    <div class="exp-detail" style="color: #0284C7;"><b>【寫作公式】：</b>${g.writing_formula}</div>
                </div>
            `;
        });
    }
    document.getElementById('vocabContent').innerHTML = html;
}

function togglePlay() {
    if (audio.paused) {
        audio.play();
        playBtn.innerText = '⏸';
    } else {
        audio.pause();
        playBtn.innerText = '▶';
    }
}

function skipTime(sec) {
    audio.currentTime = Math.max(0, Math.min(audio.duration, audio.currentTime + sec));
}

function jumpTo(sec) {
    audio.currentTime = sec;
    if (audio.paused) {
        audio.play();
        playBtn.innerText = '⏸';
    }
}

function changeSpeed(val) {
    audio.playbackRate = parseFloat(val);
}

function updateProgress() {
    if (!audio.duration) return;
    const progress = (audio.currentTime / audio.duration) * 100;
    document.getElementById('scrubber').value = progress;
    document.getElementById('currentTime').innerText = formatTime(audio.currentTime);
    document.getElementById('totalTime').innerText = formatTime(audio.duration);
}

function seekAudio(val) {
    if (!audio.duration) return;
    audio.currentTime = (val / 100) * audio.duration;
}

function onAudioEnded() {
    playBtn.innerText = '▶';
}

function formatTime(sec) {
    const m = Math.floor(sec / 60);
    const s = Math.floor(sec % 60);
    return `${m}:${s < 10 ? '0' : ''}${s}`;
}

function switchTab(tabId, btn) {
    document.querySelectorAll('.tab-pane').forEach(p => p.classList.remove('active'));
    document.querySelectorAll('.tab-btn').forEach(b => b.classList.remove('active'));
    document.getElementById(tabId).classList.add('active');
    btn.classList.add('active');
}

window.onload = initApp;
</script>
